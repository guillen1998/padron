name: Build PadronPY

on:
  push:
    branches: [ "main", "claude/elegant-galileo-mKLED" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos a gradlew
        run: chmod +x app_content/PadronPY/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app_content/PadronPY/gradle/wrapper/gradle-wrapper.properties', 'app_content/PadronPY/app/build.gradle.kts') }}
          restore-keys: |
            gradle-

      - name: Compilar APK Debug
        working-directory: app_content/PadronPY
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: PadronPY-debug
          path: app_content/PadronPY/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
